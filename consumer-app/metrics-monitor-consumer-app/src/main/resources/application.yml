spring:
  application:
    name: metrics-monitor-consumer-app
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: metrics-consumer-group
      # All 'key-deserializer', 'value-deserializer', and 'properties'
      # are now defined in KafkaConsumerConfig.java and can be removed here.
      # properties:
      #   spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
      #   spring.json.trusted.packages: "*"
      #   spring.json.value.default.type: com.arnav.metrics_monitor_consumer_app.model.MetricEvent
  data:
    mongodb:
      uri: mongodb://admin:password@localhost:27017/metrics_monitor_db?authSource=admin
app:
  kafka:
    topic: app-metrics