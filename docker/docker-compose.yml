version: '3.8'

networks:
  app-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - app-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092" # Only map the external port to your host
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    networks:
      - app-network

  mongodb:
    image: mongo:6.0
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes: # <--- NEW: Mount a named volume here
      - mongodb_data:/data/db # This maps the 'mongodb_data' named volume to /data/db inside the container.
    networks:
      - app-network

  mongo-express:
    image: mongo-express
    container_name: mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password
      ME_CONFIG_MONGODB_SERVER: mongodb
    networks:
      - app-network

  metrics-api-app: 
    build:
      context: ../api-service/metrics-api-app
      dockerfile: Dockerfile
    container_name: metrics-api-app
    ports:
      - "5050:5050"
    environment:
      MONGO_URI: "mongodb://admin:password@mongodb:27017/metrics_monitor_db?authSource=admin"
      SPRING_APPLICATION_NAME: metrics-api-app
    depends_on:
      - mongodb
    networks:
      - app-network

  metrics-producer-app:
    build:
      context: ../producer-app/metrics-monitor-producer-app # Correct build context
      dockerfile: Dockerfile
    container_name: metrics-producer-app
    ports:
      - "9797:9797" # Expose Producer's server port for Actuator/health
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_APPLICATION_NAME: metrics-producer-app
    depends_on:
      - kafka
    networks:
      - app-network

  metrics-consumer-app:
    build:
      context: ../consumer-app/metrics-monitor-consumer-app # Correct build context
      dockerfile: Dockerfile
    container_name: metrics-consumer-app
    ports:
      - "6060:6060"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_APPLICATION_NAME: metrics-consumer-app
    depends_on:
      - kafka
      - mongodb
    networks:
      - app-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus
    command: --config.file=/etc/prometheus/prometheus.yml
    depends_on:
      - metrics-api-app
    networks:
      - app-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus
    networks:
      - app-network